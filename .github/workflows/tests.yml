name: tests

on:
  push:
    branches: [main, master, '0.7.x', '0.x']
  pull_request:
    branches: [main, master, '0.7.x', '0.x']

permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        # ext-opengl is required at runtime but CI runs the snapshot-backed coverage/style suite.
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-opengl

      - name: Run Pest
        run: ./vendor/bin/pest --colors=always
